name: inspect-server

# 临时诊断工作流：跨境线路本地 SSH 不通时，借 GitHub runner 的网络
# 读取服务器部署脚本与目录结构，输出到 Action 日志。用完即删。

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-production

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 读部署脚本与目录
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=15 \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              'echo "=== deploy-volleyball.sh ==="; cat ~/deploy-volleyball.sh; echo "=== STATIC DIR ==="; ls -la ~/volleyball-site 2>/dev/null || true; grep -rn "root\|reverse_proxy" /etc/caddy/Caddyfile 2>/dev/null || sudo grep -rn "root\|reverse_proxy" /etc/caddy/Caddyfile 2>/dev/null || true'
